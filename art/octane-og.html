<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { width: 1280px; height: 640px; overflow: hidden; }
  svg { display: block; width: 1280px; height: 640px; }
</style>
</head>
<body>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060912;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bgGradient)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#14B8A6" letter-spacing="2">LARAVEL PACKAGE</text>
    <text x="0" y="80" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="84" font-weight="700" fill="#FFFFFF">Octane Doctor</text>
    <text font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="400" fill="#94A3B8">
      <tspan x="0" y="178">Detect long-lived worker risks in Laravel apps</tspan>
      <tspan x="0" y="216">before they bite production.</tspan>
    </text>
    <rect x="0" y="280" width="680" height="60" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="318" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" fill="#14B8A6" opacity="0.8">composer require geekset/octane-doctor --dev</text>
  </g>
  <g transform="translate(780, 290) rotate(-5) scale(1.05)">
    <rect x="-5" y="-5" width="450" height="300" rx="12" fill="#000000" fill-opacity="0.4" />
    <rect x="0" y="0" width="440" height="290" rx="10" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="36" rx="10" fill="#1E293B" />
    <rect x="0" y="26" width="440" height="10" fill="#1E293B" />
    <circle cx="25" cy="20" r="6" fill="#EF4444" />
    <circle cx="45" cy="20" r="6" fill="#F59E0B" />
    <circle cx="65" cy="20" r="6" fill="#10B981" />
    <g transform="translate(25, 60)" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16">
      <rect x="0" y="5" width="50" height="24" rx="4" fill="#EF4444" />
      <text x="8" y="22" fill="#FFFFFF" font-weight="700" font-size="12">HIGH</text>
      <text x="60" y="22" fill="#FFFFFF" opacity="0.9">request-context-as-property</text>
      <rect x="0" y="45" width="65" height="24" rx="4" fill="#F59E0B" />
      <text x="8" y="62" fill="#FFFFFF" font-weight="700" font-size="12">MEDIUM</text>
      <text x="75" y="62" fill="#FFFFFF" opacity="0.9">mutable-static-state</text>
      <text x="0" y="102" fill="#10B981">&#10003; 2 findings  10ms</text>
      <text x="0" y="140" fill="#94A3B8" opacity="0.5">$ _</text>
    </g>
  </g>
</svg>
</body>
</html>
